# Render Blueprint voor de NLPeter-server.
# Render vraagt bij het aanmaken om de waarden met `sync: false`.
services:
  - type: web
    name: nlpeter-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
